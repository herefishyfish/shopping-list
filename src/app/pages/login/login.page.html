<!-- Core GridLayout root: always fills the Page, so the scroll area gets a fixed height. -->
<GridLayout class="screen">
<div class="login">
  <header class="hero">
    <SvgView class="logo" src="~/assets/icons/cart.svg"></SvgView>
    <h1>Shared Shopping</h1>
    <p>One list for the whole house. Add things as you run out, tick them off in the shop, and see each other's changes instantly.</p>
  </header>

  <section class="card">
    <GoogleSignInButton class="google" colorScheme="auto" colorStyle="wide" (tap)="google()"></GoogleSignInButton>

    <div class="divider">
      <span>or use email</span>
    </div>

    @if (mode() === 'register') {
      <div class="field"><TextField class="input" hint="Your name" [text]="name()" (textChange)="name.set($any($event).value)" autocapitalizationType="words" autocorrect="false"></TextField></div>
    }
    <div class="field"><TextField class="input" hint="Email" [text]="email()" (textChange)="email.set($any($event).value)" keyboardType="email" autocapitalizationType="none" autocorrect="false"></TextField></div>
    <div class="field"><TextField class="input" hint="Password" [text]="password()" (textChange)="password.set($any($event).value)" secure="true" autocapitalizationType="none" autocorrect="false" returnKeyType="done" (returnPress)="submitEmail()"></TextField></div>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button class="btn primary" (tap)="submitEmail()">{{ mode() === 'register' ? 'Create account' : 'Sign in' }}</button>
    <button class="btn link" (tap)="toggleMode()">
      {{ mode() === 'register' ? 'Already have an account? Sign in' : 'New here? Create an account' }}
    </button>
  </section>
</div>
</GridLayout>
