<section class="entry">
  <div class="entry-row">
    <div class="field entry-name"><TextField class="input" hint="Add an item…" [text]="query()" (textChange)="query.set($any($event).value)" autocapitalizationType="sentences" returnKeyType="done" (returnPress)="submit()"></TextField></div>
    <div class="field entry-qty"><TextField class="input" hint="Qty" [text]="qty()" (textChange)="qty.set($any($event).value)" autocorrect="false" returnKeyType="done" (returnPress)="submit()"></TextField></div>
    <button class="btn primary" (tap)="submit()">Add</button>
  </div>

  @if (query().trim() && matches().length) {
    <div class="suggestions">
      <span class="hint">From your previous lists · hold to remove</span>
      @for (s of matches(); track s.id) {
        <div class="suggestion" (tap)="pick(s)" (longPress)="forget(s)">
          <span class="suggestion-name">{{ s.name }}</span>
          <span class="suggestion-count">{{ s.count }}×</span>
        </div>
      }
    </div>
  } @else if (buyAgain().length) {
    <div class="buy-again">
      <span class="hint">Buy again · hold to remove</span>
      <div class="chips">
        @for (s of buyAgain(); track s.id) {
          <button class="chip" (tap)="pick(s)" (longPress)="forget(s)">+ {{ s.name }}</button>
        }
      </div>
    </div>
  }
</section>
